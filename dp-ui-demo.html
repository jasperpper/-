  <script>
    const { createApp, ref } = Vue;
    const DpUILib = window.DpUI && (window.DpUI.default || window.DpUI);

    createApp({
      setup() {
        const keyword = ref('');
        const title = ref('DataPocket');
        const question = ref('');
        const columns = [
          { key: 'name', title: '名称' },
          { key: 'owner', title: '负责人' },
          { key: 'status', title: '状态' },
        ];
        const data = [
          { id: '1', name: '数据专题', owner: 'DP Team', status: '已上线' },
          { id: '2', name: '来源面板', owner: 'AI Team', status: '设计中' },
        ];
        const features = [
          { title: '摘要生成', description: '快速生成内容总结', icon: 'zap' },
          { title: '报告分析', description: '读取数据并生成报告', icon: 'report' },
        ];
        return { keyword, title, question, columns, data, features };
      },
      template: `
        <main class="demo-page">
          <header class="demo-hero">
            <h1>DP UI Vue Components + Raw Components</h1>
            <p>正式组件库用于产品调用；Raw Components 用于设计稿原始节点快照和走查。</p>
          </header>

          <section class="demo-section">
            <h2>正式组件库</h2>
            <div class="demo-row">
              <DpButton><template #icon><DpIcon name="plus" /></template>新建专题</DpButton>
              <DpButton variant="secondary">添加来源</DpButton>
              <DpButton variant="outline">描边按钮</DpButton>
              <DpButton variant="ghost">更多</DpButton>
              <DpButton variant="destructive">删除</DpButton>
              <DpButton loading>生成中</DpButton>
            </div>
            <p class="demo-note">抽象后的正式组件：适合业务产品安装调用。</p>
          </section>

          <section class="demo-section">
            <h2>输入与标签</h2>
            <div class="demo-row">
              <DpInput v-model="title" placeholder="请输入标题" clearable />
              <DpSearchInput v-model="keyword" placeholder="搜索专题、来源或指标" />
              <DpSelect :options="[{ label: '全部', value: 'all' }, { label: '已关注', value: 'followed' }]" />
              <DpTag variant="success" icon="document">已关注</DpTag>
              <DpTag variant="warning">需处理</DpTag>
              <DpTag variant="keyword">关键词</DpTag>
            </div>
          </section>

          <section class="demo-section">
            <h2>内容卡片 / 表格 / AI</h2>
            <div class="demo-grid">
              <DpTopicCard title="推荐专题" description="最近访问的数据专题" tag="精选" />
              <DpTile title="文件夹" description="归档后的内容集合" icon="document" />
              <DpMetricCard label="访问量" value="12.8k" trend="+18%" />
            </div>
            <br />
            <DpDataTable :columns="columns" :data="data" bordered />
            <br />
            <div class="demo-grid">
              <DpAskBox v-model="question" placeholder="问问这个专题" />
              <DpAnswerBlock content="这里是 AI 回答内容，可放来源、操作和加载态。" />
              <DpFeatureGrid :items="features" />
            </div>
          </section>

          <section class="demo-section">
            <h2>Raw Components</h2>
            <p class="demo-note">以下是从 Pencil 269 个 reusable 节点生成的 raw 快照层。它们保留设计节点名称、id、尺寸、颜色、描边、圆角等元数据。</p>
            <DpRawGallery :limit="36" />
          </section>
        </main>
      `,
    }).use(DpUILib).mount('#app');
  </script>
</body>
